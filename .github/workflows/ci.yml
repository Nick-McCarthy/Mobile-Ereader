# Build, lint, and test on GitHub's macOS runners. See docs/CI_AND_BUILD.md.
# Uses no secrets, so it is safe for pull requests from forks. Never switch this to pull_request_target.
name: CI

# Pushes to main run CI; other branches are covered by their pull request (one run per update).
# Use "Run workflow" (workflow_dispatch) to test a branch that has no PR yet.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Bump these together, deliberately, in their own PR. Check the runner image's
  # installed Xcodes and simulators: https://github.com/actions/runner-images
  XCODE_VERSION: "26.3"
  SIMULATOR: "platform=iOS Simulator,name=iPhone 17,OS=26.2"

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Lint (swift-format)
        run: xcrun swift-format lint --strict --recursive --parallel App UITests Packages

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Packages/EreaderKit/.build
            build/SourcePackages
          key: spm-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('Packages/EreaderKit/Package.swift', 'Packages/EreaderKit/Package.resolved', 'project.yml', 'Config/Package.resolved') }}
          restore-keys: spm-xcode${{ env.XCODE_VERSION }}-

      # Pinning: Packages/EreaderKit/Package.resolved (swift test) and Config/Package.resolved (the app,
      # copied into the generated project). When committed, builds may only use those exact versions.
      - name: Package tests
        run: |
          ARGS=()
          if [ -f Packages/EreaderKit/Package.resolved ]; then
            ARGS+=(--force-resolved-versions)
          fi
          swift test --package-path Packages/EreaderKit "${ARGS[@]}"

      - name: Write Config/Secrets.xcconfig from repository variables
        env:
          DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY }}
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
        run: |
          printf 'DROPBOX_APP_KEY = %s\nMICROSOFT_CLIENT_ID = %s\n' \
            "$DROPBOX_APP_KEY" "$MICROSOFT_CLIENT_ID" > Config/Secrets.xcconfig

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve app packages
        run: |
          RESOLVED=Ereader.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          mkdir -p "$(dirname "$RESOLVED")"
          PKG_FLAGS=""
          if [ -f Config/Package.resolved ]; then
            cp Config/Package.resolved "$RESOLVED"
            PKG_FLAGS="-onlyUsePackageVersionsFromResolvedFile -disableAutomaticPackageResolution"
          fi
          echo "PKG_FLAGS=$PKG_FLAGS" >> "$GITHUB_ENV"
          xcodebuild -resolvePackageDependencies -project Ereader.xcodeproj -scheme Ereader \
            -clonedSourcePackagesDirPath build/SourcePackages $PKG_FLAGS
          echo "Package.resolved files after resolution:"
          find . -name Package.resolved -not -path "*/checkouts/*" -not -path "*/.build/*" -print
          find Ereader.xcodeproj -print
          find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 4 -name Package.resolved -print || true
          ls -la build/SourcePackages || true
          # Collect both resolved files so they can be committed (bootstrap) or reviewed.
          mkdir -p build/resolved/Config build/resolved/Packages/EreaderKit
          cp "$RESOLVED" build/resolved/Config/Package.resolved
          cp Packages/EreaderKit/Package.resolved build/resolved/Packages/EreaderKit/Package.resolved

      - name: Upload resolved package versions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-resolved
          path: build/resolved
          if-no-files-found: ignore

      - name: Build and run UI tests on the simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -project Ereader.xcodeproj \
            -scheme Ereader \
            -destination "$SIMULATOR" \
            -resultBundlePath build/Ereader.xcresult \
            -clonedSourcePackagesDirPath build/SourcePackages \
            $PKG_FLAGS \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            | xcbeautify --renderer github-actions

      - name: Export screenshots
        if: always()
        run: |
          if [ -d build/Ereader.xcresult ]; then
            mkdir -p build/screenshots
            xcrun xcresulttool export attachments \
              --path build/Ereader.xcresult --output-path build/screenshots
            # Rename "<uuid>.png" to the attachment name, e.g. "Library tab.png".
            cd build/screenshots
            jq -r '.[].attachments[] | [.exportedFileName,
                (.suggestedHumanReadableName | sub("_[0-9]+_[0-9A-Fa-f-]+\\.png$"; ".png"))] | @tsv' manifest.json |
              while IFS=$'\t' read -r from to; do mv -- "$from" "$to"; done
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: build/Ereader.xcresult
          if-no-files-found: ignore

      - name: Require committed Package.resolved files
        run: |
          missing=0
          for f in Packages/EreaderKit/Package.resolved Config/Package.resolved; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::$f is not committed. Download the package-resolved artifact from this run and commit it."
              missing=1
            fi
          done
          exit $missing
